name: Update Contribution Chart

on:
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution chart
        run: |
          curl -L "https://github.com/ashutosh00710/github-readme-activity-graph/raw/master/src/index.js" -o /tmp/chart.js

      - name: Create chart
        run: |
          echo "Contribution chart generation"

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update contribution chart"
          git push
